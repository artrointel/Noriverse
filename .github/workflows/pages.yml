name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm test
      - name: Verify profile storage on the configured Worker
        env:
          NORIVERSE_WORKER: ${{ vars.NORIVERSE_API_ORIGIN }}
          NORIVERSE_PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          if [ -n "$NORIVERSE_WORKER" ]; then
            npm run test:profile-storage -- "$NORIVERSE_WORKER" "$NORIVERSE_PAGES_ORIGIN"
          fi
      - name: Build frontend
        run: |
          npm run build -- --base "${PAGES_BASE%/}/"
          cp LICENSE dist/LICENSE
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          VITE_GITHUB_PAGES: 'true'
          VITE_API_ORIGIN: ${{ vars.NORIVERSE_API_ORIGIN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
